name: engine-scripts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # Node на раннере уже стоит; скрипты движка без зависимостей, ставить нечего.
      - run: node --version
      - run: node --test tests/engine.test.mjs
